<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>NFT preview card component</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .attribution {
            font-size: 0.6875rem;
            text-align: center;
        }

        .attribution a {
            color: hsl(228, 45%, 44%);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image-container">
         <img class="square" src="./images/image-equilibrium.jpg" alt="Equilibrium">
         <div class="overlay">
             <img class="view" src="./images/icon-view.svg" alt="View">
         </div>
        </div>

        <h1>Equilibrium #3429</h1>
        <p>Our Equilibrium collection promotes balance and calm.</p>
        <div class="info">
            <div class="value">
                <img src="./images/icon-ethereum.svg" alt="Ethereum">
                <span>0.041 ETH</span>
            </div>
            <div class="time">
                <img src="./images/icon-clock.svg" alt="Clock">
                <span>3 days left</span>
            </div>
        </div>
        <hr>
        <div class="creator">
            <img src="./images/image-avatar.png" alt="Avatar" class="avatar">
            <span>Creation of <b>Jules Wyvern</b></span>
            
        </div>
        <p class="name">DEV by <a  class="name" href="https://wa.me/01201114123" target="_blank"><b>ABELSALAM</b></a></p>

    </div>



</body>

</html>
